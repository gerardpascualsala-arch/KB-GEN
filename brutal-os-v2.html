<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0B0F">
<title>BRUTAL OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ════════ TOKENS ════════ */
:root{
  --bg:#0A0B0F; --bg2:#0F1116; --surface:#15171F; --surface2:#1C1F2A;
  --border:#262A38; --border2:#323748;
  --text:#EEF0F6; --muted:#6F7689; --muted2:#9AA1B4;
  --accent:#9D6BFF; --accent2:#B78FFF; --accent-deep:#5B34C2; --accent-bg:#1C1430;
  --amber:#F5A045; --amber-bg:#2A1F10;
  --success:#37C98F;
  --danger:#E05B4E;
  --rest:#3B9EE8;
  --r:14px; --r2:22px;
  --shadow:0 2px 14px rgba(0,0,0,.45);
  --fd:'Bebas Neue',sans-serif; --fb:'DM Sans',sans-serif; --fm:'DM Mono',monospace;
  --tr:.3s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
::selection{background:var(--accent-deep);color:#fff}

.wrap{max-width:540px;margin:0 auto;width:100%}
.pad{padding:0 20px}
.screen{display:none;min-height:100dvh;padding-bottom:calc(34px + env(safe-area-inset-bottom));animation:fade .3s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ════════ HEADER ════════ */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;padding:26px 20px 14px}
.hdr h1{font-family:var(--fd);font-size:34px;letter-spacing:.05em;line-height:1}
.hdr h1 em{font-style:normal;color:var(--accent)}
.hdr .sub{font-family:var(--fm);font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--surface2);border:1px solid var(--border2);display:grid;place-items:center;flex-shrink:0}
.iconbtn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ════════ CARDS / HERO ════════ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:20px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--fm);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hero{background:linear-gradient(150deg,var(--surface) 0%,var(--accent-bg) 130%);border:1px solid var(--border2);border-radius:var(--r2);padding:24px 22px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-60px;right:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(157,107,255,.14),transparent 70%)}
.hero .day{font-family:var(--fd);font-size:52px;line-height:.95;letter-spacing:.03em}
.hero .date{font-family:var(--fm);font-size:12px;color:var(--muted2);letter-spacing:.1em;margin-top:6px}
.hero .plan-tag{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 14px;border-radius:99px;background:var(--accent-bg);border:1px solid var(--accent-deep);font-family:var(--fm);font-size:12px;letter-spacing:.08em;color:var(--accent2)}
.hero .plan-tag.rest{background:var(--surface2);border-color:var(--border2);color:var(--muted2)}
.hero .plan-tag.cardio{background:#0E2436;border-color:#1E4A6B;color:#5BB8FF}

/* ════════ ROUTINE ROWS ════════ */
.rt{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;width:100%;text-align:left;transition:border-color var(--tr),transform .15s}
.rt:active{transform:scale(.985)}
.rt+.rt{margin-top:10px}
.rt .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:19px;flex-shrink:0;letter-spacing:.03em}
.rt .nm{font-weight:600;font-size:15px}
.rt .mt{font-family:var(--fm);font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.rt .go{margin-left:auto;color:var(--muted);flex-shrink:0}
.ic.sab{background:#2A1A0E;color:#F08A3C}
.ic.dom{background:#0E2436;color:#5BB8FF}
.ic.com{background:#0E2A1F;color:#37C98F}
.ic.pro{background:var(--accent-bg);color:var(--accent2)}
.ic.run{background:#22252F;color:#9AA1B4}
.ic.gen{background:#2A1F10;color:var(--amber)}
.sec-title{font-family:var(--fd);font-size:22px;letter-spacing:.05em;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ════════ CHIPS / FORM ════════ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);font-family:var(--fm);font-size:12px;letter-spacing:.05em;color:var(--muted2);transition:all var(--tr)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}
.f-label{font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
.f-label:first-child{margin-top:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;border-radius:var(--r);font-family:var(--fd);font-size:21px;letter-spacing:.1em;transition:all var(--tr)}
.btn:active{transform:scale(.98)}
.btn-p{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);color:#fff;box-shadow:0 4px 22px rgba(157,107,255,.3)}
.btn-s{background:var(--surface2);border:1px solid var(--border2);color:var(--text)}
.btn-d{background:transparent;border:1px solid var(--danger);color:var(--danger)}

/* ════════ OVERLAYS ════════ */
.ov{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;display:none;animation:up .3s ease}
.ov.active{display:block}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.ov-hdr{display:flex;align-items:center;gap:14px;padding:22px 20px 10px;max-width:540px;margin:0 auto}

/* ════════ PREVIEW ════════ */
.blk{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:12px}
.blk-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.blk-h .t{font-family:var(--fd);font-size:17px;letter-spacing:.07em}
.blk-h .m{font-family:var(--fm);font-size:10.5px;color:var(--accent2);letter-spacing:.1em}
.blk ul{list-style:none}
.blk li{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border);font-size:14px}
.blk li:last-child{border-bottom:none}
.blk li .d{font-family:var(--fm);font-size:12px;color:var(--muted);flex-shrink:0;margin-left:10px}

/* ════════ PLAYER ════════ */
.pl{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 20px calc(18px + env(safe-area-inset-bottom))}
.pl-top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.pl-top .rt-name{font-family:var(--fd);font-size:19px;letter-spacing:.07em;color:var(--muted2);text-align:center;flex:1;padding:0 10px}
.pl-prog{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.pl-prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.pl-meta{display:flex;justify-content:space-between;font-family:var(--fm);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
/* tira de bloques — toca para saltar */
.bstrip{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bstrip::-webkit-scrollbar{display:none}
.bchip{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:var(--muted2);transition:all var(--tr)}
.bchip .nn{font-family:var(--fd);font-size:13px;letter-spacing:.05em;color:var(--muted)}
.bchip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}
.bchip.on .nn{color:var(--accent2)}
.bchip.done{opacity:.45}
.pl-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 0;min-height:0}
.pill{font-family:var(--fm);font-size:11px;letter-spacing:.16em;padding:7px 16px;border-radius:99px;background:var(--accent-bg);color:var(--accent2);border:1px solid var(--accent-deep);text-transform:uppercase}
.pill.rest{background:#0E2436;color:#5BB8FF;border-color:#1E4A6B}
.pill.warm{background:var(--amber-bg);color:var(--amber);border-color:#6B4A1E}
.ring-box{position:relative;width:min(62vw,255px);aspect-ratio:1;margin:16px 0 8px}
.ring-box svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:11}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;stroke-dasharray:779;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring-fg.rest{stroke:var(--rest)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c .t{font-family:var(--fd);font-size:clamp(58px,18vw,80px);line-height:1;font-variant-numeric:tabular-nums}
.ring-c .s{font-family:var(--fm);font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.paused .ring-c .t{animation:blink 1.1s ease infinite}
@keyframes blink{50%{opacity:.35}}
.ex-pre{font-family:var(--fm);font-size:11px;letter-spacing:.2em;color:var(--rest);text-transform:uppercase;min-height:1.2em}
.ex-now{font-family:var(--fd);font-size:clamp(26px,7.4vw,34px);letter-spacing:.04em;line-height:1.1;min-height:1.1em;margin-top:3px}
.ex-det{font-family:var(--fm);font-size:13px;color:var(--accent2);margin-top:7px;letter-spacing:.05em;min-height:1.2em}
.ex-next{margin-top:13px;font-family:var(--fm);font-size:11.5px;color:var(--muted);letter-spacing:.08em;min-height:1.3em}
.ex-next b{color:var(--muted2);font-weight:500}
.pl-ctrl{display:grid;grid-template-columns:62px 1fr 62px;gap:12px;padding-top:10px}
.cbtn{height:62px;border-radius:18px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border2);transition:transform .12s}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:24px;height:24px;fill:var(--text)}
.cbtn.main{background:linear-gradient(135deg,var(--accent),var(--accent-deep));border:none;box-shadow:0 4px 24px rgba(157,107,255,.35)}
.cbtn.main svg{fill:#fff}

/* ════════ SUMMARY ════════ */
.sum{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px}
.sum .big{font-family:var(--fd);font-size:56px;letter-spacing:.04em;line-height:1}
.sum .big em{font-style:normal;color:var(--success)}
.sum .time{font-family:var(--fd);font-size:84px;color:var(--accent2);margin:22px 0 4px;font-variant-numeric:tabular-nums}
.sum .tl{font-family:var(--fm);font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}

/* ════════ MODAL ════════ */
.modal{position:fixed;inset:0;background:rgba(5,6,9,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:120;display:none;align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.modal-c{background:var(--surface);border:1px solid var(--border2);border-radius:24px 24px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom));width:100%;max-width:540px;animation:up .22s ease}
.modal-c h3{font-family:var(--fd);font-size:26px;letter-spacing:.06em;margin-bottom:8px}
.hint{font-family:var(--fm);font-size:11px;color:var(--muted);line-height:1.7;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ════════════ HOME ════════════ -->
<section class="screen active" id="scr-home">
  <div class="wrap">
    <div class="hdr">
      <div><h1>BRUTAL<em>OS</em></h1><div class="sub">Elige · entrena · fuera</div></div>
      <button class="iconbtn" id="soundBtn" title="Sonido">
        <svg viewBox="0 0 24 24" id="soundIco"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
    </div>
    <div class="pad">
      <div class="hero" id="heroBox"></div>
      <div id="todaySuggest"></div>
      <div class="sec-title">GENERADOR</div>
      <div class="card">
        <div class="f-label">Material</div>
        <div class="chips" id="genMat"></div>
        <div class="f-label">Objetivo</div>
        <div class="chips" id="genObj"></div>
        <div class="f-label">Duración</div>
        <div class="chips" id="genDur"></div>
        <button class="btn btn-p" style="margin-top:20px" onclick="generate()">⚡ GENERAR SESIÓN</button>
      </div>
      <div class="sec-title">SÁBADO · FUERZA</div>
      <div id="listSab"></div>
      <div class="sec-title">DOMINGO · RESISTENCIA</div>
      <div id="listDom"></div>
      <div class="sec-title">COMODINES</div>
      <div id="listCom"></div>
      <p class="hint" style="margin-top:26px;text-align:center">BRUTAL OS · v2.0 · el registro lo lleva tu pulsera</p>
    </div>
  </div>
</section>

<!-- ════════════ PREVIEW ════════════ -->
<section class="ov" id="preview">
  <div class="wrap" style="padding-bottom:30px">
    <div class="ov-hdr">
      <button class="iconbtn" onclick="closePreview()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div>
        <div style="font-family:var(--fd);font-size:26px;letter-spacing:.05em" id="pvName"></div>
        <div class="eyebrow" id="pvMeta" style="margin-top:3px"></div>
      </div>
    </div>
    <div class="pad">
      <div id="pvBlocks"></div>
      <button class="btn btn-p" style="margin-top:22px" onclick="startSession()">▶ EMPEZAR</button>
    </div>
  </div>
</section>

<!-- ════════════ PLAYER ════════════ -->
<section class="ov" id="player">
  <div class="pl">
    <div class="pl-top">
      <button class="iconbtn" onclick="askQuit()"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div class="rt-name" id="plName"></div>
      <div style="width:42px"></div>
    </div>
    <div class="pl-prog"><i id="plProg"></i></div>
    <div class="pl-meta"><span id="plBlockPos"></span><span id="plElapsed"></span></div>
    <div class="bstrip" id="bstrip"></div>
    <div class="pl-stage" id="plStage">
      <div class="pill" id="plPill">BLOQUE</div>
      <div class="ring-box">
        <svg viewBox="0 0 280 280">
          <circle class="ring-bg" cx="140" cy="140" r="124"/>
          <circle class="ring-fg" id="ringFg" cx="140" cy="140" r="124"/>
        </svg>
        <div class="ring-c">
          <div class="t" id="ringT">0:00</div>
          <div class="s" id="ringS">TIEMPO</div>
        </div>
      </div>
      <div class="ex-pre" id="exPre"></div>
      <div class="ex-now" id="exNow"></div>
      <div class="ex-det" id="exDet"></div>
      <div class="ex-next" id="exNext"></div>
    </div>
    <div class="pl-ctrl">
      <button class="cbtn" onclick="prevStep()"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16zM7 19V5H5v14h2z"/></svg></button>
      <button class="cbtn main" id="playBtn" onclick="togglePlay()"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7L8 5z"/></svg></button>
      <button class="cbtn" onclick="nextStep()"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM17 5v14h2V5h-2z"/></svg></button>
    </div>
  </div>
</section>

<!-- ════════════ SUMMARY ════════════ -->
<section class="ov" id="summary">
  <div class="sum">
    <div class="eyebrow">SESIÓN COMPLETADA</div>
    <div class="big" style="margin-top:10px">TRABAJO <em>HECHO</em></div>
    <div class="time" id="sumTime">00:00</div>
    <div class="tl" id="sumName"></div>
    <button class="btn btn-p" style="margin-top:36px;max-width:340px" onclick="backHome()">VOLVER AL INICIO</button>
  </div>
</section>

<!-- ════════════ MODAL SALIR ════════════ -->
<div class="modal" id="quitModal">
  <div class="modal-c">
    <h3>¿SALIR DE LA SESIÓN?</h3>
    <p class="hint" style="margin-bottom:18px">El cronómetro se detendrá y volverás al inicio.</p>
    <button class="btn btn-d" onclick="doQuit()">SALIR</button>
    <button class="btn btn-p" style="margin-top:10px" onclick="closeQuit()">SEGUIR ENTRENANDO</button>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const CIRC=779.1;

/* ── PREFERENCIAS (solo sonido) ── */
let SOUND=true;
try{SOUND=localStorage.getItem('brutal_sound')!=='0';}catch(e){}
function persistSound(){try{localStorage.setItem('brutal_sound',SOUND?'1':'0');}catch(e){}}

/* ════════════════════════════════════════════
   RUTINAS FIJAS — familia BRUTAL
   ════════════════════════════════════════════ */
const W_STD={type:'CIRCUIT',name:'CALENTAMIENTO',rounds:1,work:45,rest:10,warm:true,ex:[
  {n:'Jumping jacks'},{n:'Sentadilla profunda',d:'sin peso'},{n:'Rotaciones de cadera'},
  {n:'World\u2019s greatest stretch'},{n:'Halo con KB16',d:'5/lado'},{n:'Swing ligero KB16'}]};

const ROUTINES=[
{id:'S1',fam:'sab',name:'S1 · FUERZA EMOM',tag:'2×KB20 · 45\u2032',dur:45,desc:'EMOM clásico de fuerza con dobles. El núcleo del plan de sábado.',blocks:[
  W_STD,
  {type:'EMOM',name:'EMOM FUERZA',minutes:18,ex:[
    {n:'Doble front squat',d:'6 reps · 2×20'},{n:'Doble clean',d:'6 reps'},{n:'Doble push press',d:'6 reps'},
    {n:'Doble remo inclinado',d:'8 reps'},{n:'Swing 2 manos',d:'12 reps · KB20'},{n:'Descanso activo',d:'respira',rest:true}]},
  {type:'FREE',name:'FUERZA + ESTABILIDAD',ex:[
    {n:'Windmill KB16',t:90,d:'45s por lado'},{n:'Front rack carry 2×20',t:60,d:'pasillo ida/vuelta'},
    {n:'Renegade row 2×20',t:60,d:'reps controladas'},{n:'Windmill KB16',t:90,d:'2ª serie'},
    {n:'Front rack carry 2×20',t:60},{n:'Renegade row 2×20',t:60}]},
  {type:'TABATA',name:'FINISHER SWINGS',ex:[{n:'Swing 2 manos KB20'},{n:'Hollow hold'}]}]},

{id:'S2',fam:'sab',name:'S2 · POTENCIA BALÍSTICA',tag:'2×KB20 + KB16 · 45\u2032',dur:45,desc:'Énfasis balístico: clean & press, high pull, salto. Más explosivo que S1.',blocks:[
  W_STD,
  {type:'EMOM',name:'EMOM POTENCIA',minutes:18,ex:[
    {n:'Doble clean & press',d:'5 reps'},{n:'High pull KB20',d:'8 reps'},{n:'Sentadilla con salto',d:'10 reps'},
    {n:'Swing 1 mano',d:'8+8 · KB20'},{n:'Doble deadlift',d:'8 reps lentas'},{n:'Descanso activo',rest:true}]},
  {type:'FREE',name:'UNILATERAL',ex:[
    {n:'Push press 1 brazo KB20',t:60,d:'30s/lado'},{n:'Suitcase carry KB20',t:60,d:'30s/lado'},
    {n:'Goblet reverse lunge KB16',t:60,d:'alternas'},{n:'Push press 1 brazo KB20',t:60},
    {n:'Suitcase carry KB20',t:60},{n:'Goblet reverse lunge KB16',t:60}]},
  {type:'TABATA',name:'FINISHER',ex:[{n:'Burpees'},{n:'Swing KB20'}]}]},

{id:'D1',fam:'dom',name:'D1 · RESISTENCIA 40/20',tag:'KB + BW · 45\u2032',dur:45,desc:'Circuito de resistencia muscular del plan KB-B + bloque maestro TGU.',blocks:[
  W_STD,

const OBJS=[
 {id:'fuerza',l:'Fuerza'},{id:'potencia',l:'Potencia'},{id:'resistencia',l:'Resistencia'},
 {id:'fatburner',l:'Fat burner'},{id:'core',l:'Core'},{id:'upper',l:'Sin piernas'},{id:'fullb',l:'Full body'}];
const DURS=[20,30,45,60];
let genSel={mat:'full',obj:'fuerza',dur:45};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pickDiverse(pool,n){
  const out=[],used=new Set();
  for(const e of shuffle(pool)){if(out.length>=n)break;if(!used.has(e.g)){out.push(e);used.add(e.g);}}
  for(const e of shuffle(pool)){if(out.length>=n)break;if(!out.includes(e))out.push(e);}
  return out;
}
function generate(){
  const mat=MATS.find(m=>m.id===genSel.mat);
  const noLegs=genSel.obj==='upper';
  let pool=BANK.filter(e=>mat.allow.includes(e.m)&&(!noLegs||!e.legs));
  const by=md=>pool.filter(e=>e.md===md);
  const D=genSel.dur;
  const blocks=[];
  blocks.push({type:'CIRCUIT',name:'CALENTAMIENTO',rounds:1,work:40,rest:10,warm:true,
    ex:pickDiverse(noLegs?WARM_BW.filter(w=>!/Sentadilla|Zancada|Escaladores/.test(w.n)):WARM_BW,5)});
  const warmMin=5, finMin=D>=30?4:0;
  let mainMin=D-warmMin-finMin;
  const O=genSel.obj;
  if(O==='fuerza'||O==='potencia'){
    const pref=O==='fuerza'?by('str'):by('bal');
    const fill=pool.filter(e=>e.md==='str'||e.md==='bal');
    let exs=pickDiverse(pref.length>=5?pref:fill,5).map(e=>({n:e.n,d:e.d||(O==='fuerza'?'6-8 reps':'8-12 reps')}));
    exs.push({n:'Descanso activo',d:'respira',rest:true});
    blocks.push({type:'EMOM',name:O==='fuerza'?'EMOM FUERZA':'EMOM POTENCIA',minutes:Math.max(10,Math.floor(mainMin/6)*6),ex:exs});
  }else{
    let work=45,rest=15,nEx=6;
    if(O==='resistencia'){work=40;rest=20;}
    if(O==='core'){work=35;rest=15;}
    let basePool=pool;
    if(O==='core')basePool=by('core');
    if(O==='upper')basePool=pool.filter(e=>e.g==='push'||e.g==='pull'||e.g==='core');
    if(O==='fatburner')basePool=pool.filter(e=>e.md==='met'||e.md==='bal'||e.md==='str');
    if(basePool.length<nEx)basePool=pool;
    const exs=pickDiverse(basePool,nEx).map(e=>({n:e.n,d:e.d}));
    const rounds=Math.max(2,Math.round(mainMin*60/(nEx*(work+rest))));
    blocks.push({type:'CIRCUIT',name:'CIRCUITO '+work+'/'+rest,rounds,work,rest,ex:exs});
  }
  if(finMin>0){
    const finPool=pool.filter(e=>(e.md==='bal'||e.md==='met')&&(!noLegs||!e.legs));
    const f=pickDiverse(finPool.length?finPool:by('core'),2).map(e=>({n:e.n}));
    blocks.push({type:'TABATA',name:'TABATA FINAL',ex:f});
  }
  const objL=OBJS.find(o=>o.id===O).l.toUpperCase();
  openPreview({id:'GEN',fam:'gen',name:'⚡ '+objL+' · '+D+'\u2032',tag:mat.l,dur:D,
    desc:'Sesión generada. Vuelve a pulsar GENERAR para otra combinación.',blocks});
}

/* ════════════════════════════════════════════
   COMPILADOR — cada paso lleva blockIdx
   ════════════════════════════════════════════ */
function compile(rt){
  const steps=[],blockStarts=[];
  rt.blocks.forEach((b,bi)=>{
    blockStarts.push({i:steps.length,name:b.name,type:b.type});
    if(b.type==='EMOM'){
      for(let i=0;i<b.minutes;i++){
        const e=b.ex[i%b.ex.length];
        steps.push({bi,block:b.name,n:e.n,d:e.d||'',dur:60,rest:!!e.rest,emom:'MIN '+(i+1)+'/'+b.minutes});
      }
    }else if(b.type==='CIRCUIT'){
      for(let r=0;r<b.rounds;r++){
        b.ex.forEach((e,i)=>{
          steps.push({bi,block:b.name+(b.rounds>1?' · R'+(r+1)+'/'+b.rounds:''),n:e.n,d:e.d||'',dur:b.work,warm:b.warm});
          const last=r===b.rounds-1&&i===b.ex.length-1;
          if(!last&&b.rest>0)steps.push({bi,block:b.name,n:'Transición',d:'',dur:b.rest,rest:true});
        });
      }
    }else if(b.type==='TABATA'){
      for(let r=0;r<8;r++){
        const e=b.ex[r%b.ex.length];
        steps.push({bi,block:b.name+' · '+(r+1)+'/8',n:e.n,d:'máxima intensidad',dur:20});
        if(r<7)steps.push({bi,block:b.name,n:'Descanso',d:'',dur:10,rest:true});
      }
    }else if(b.type==='FREE'){
      b.ex.forEach(e=>steps.push({bi,block:b.name,n:e.n,d:e.d||'',dur:e.t||60}));
    }
  });
  return {steps,blockStarts};
}
function fmtMin(s){return Math.round(s/60);}
function totalDur(rt){return compile(rt).steps.reduce((a,s)=>a+s.dur,0);}
function fmtClock(t){const m=Math.floor(t/60),s=String(t%60).padStart(2,'0');return m+':'+s;}

let steps=[],blockStarts=[],idx=0,running=false,endAt=0,remain=0,tick=null,
    startedAt=0,pausedTotal=0,pauseStart=0,lastBeep=-1,wakeLock=null;

function startSession(){
  closePreview();
  const c=compile(curRt);
  steps=c.steps;blockStarts=c.blockStarts;
  idx=0;startedAt=Date.now();pausedTotal=0;pauseStart=0;
  $('plName').textContent=curRt.name;
  renderStrip();
  $('player').classList.add('active');
  loadStep();
  running=false;togglePlay();
  reqWake();
}
async function reqWake(){try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('player').classList.contains('active'))reqWake();});

/* tira de bloques tocable */
function shortName(n){
  return n.replace('CALENTAMIENTO','CALENT.').replace('CIRCUITO ','CIRC. ')
          .replace('TABATA FINAL','TABATA').split(' · ')[0].slice(0,14);
}
function renderStrip(){
  $('bstrip').innerHTML=blockStarts.map((b,i)=>
    '<button class="bchip" id="bchip'+i+'" onclick="jumpBlock('+i+')">'+
    '<span class="nn">'+(i+1)+'</span>'+shortName(b.name)+'</button>').join('');
}
function updateStrip(){
  const cur=steps[idx].bi;
  blockStarts.forEach((b,i)=>{
    const el=$('bchip'+i);
    el.className='bchip'+(i===cur?' on':(i<cur?' done':''));
  });
  const el=$('bchip'+cur);
  if(el)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function jumpBlock(bi){
  idx=blockStarts[bi].i;
  loadStep();
  beep(520,.08);
}

function loadStep(){
  const s=steps[idx];
  remain=s.dur;lastBeep=-1;
  $('plPill').textContent=s.block+(s.emom?' · '+s.emom:'');
  $('plPill').className='pill'+(s.rest?' rest':(s.warm?' warm':''));
  /* descanso → enseña lo que viene */
  const nx=steps[idx+1];
  const nxWork=nextWork();
  if(s.rest&&nxWork){
    $('exPre').textContent='PREPARA →';
    $('exNow').textContent=nxWork.n;
    $('exDet').textContent=nxWork.d||'';
    $('exNext').innerHTML='';
  }else{
    $('exPre').textContent='';
    $('exNow').textContent=s.n;
    $('exDet').textContent=s.d||'';
    $('exNext').innerHTML=nx?'SIGUIENTE → <b>'+nx.n+'</b>':'— ÚLTIMO PASO —';
  }
  $('plBlockPos').textContent='BLOQUE '+(s.bi+1)+'/'+blockStarts.length;
  $('ringFg').className.baseVal='ring-fg'+(s.rest?' rest':'');
  $('ringS').textContent=s.rest?'DESCANSO':(s.emom?'EMOM':'TIEMPO');
  if(navigator.vibrate)navigator.vibrate(s.rest?40:[40,60,40]);
  updateStrip();
  paint();
  if(running)endAt=Date.now()+remain*1000;
}
function nextWork(){
  for(let i=idx+1;i<steps.length;i++){if(!steps[i].rest)return steps[i];}
  return null;
}
function paint(){
  const s=steps[idx];
  const mm=Math.floor(remain/60),ss=String(remain%60).padStart(2,'0');
  $('ringT').textContent=remain<60?remain:(mm+':'+ss);
  $('ringFg').style.strokeDashoffset=CIRC*(1-remain/s.dur);
  const done=steps.slice(0,idx).reduce((a,x)=>a+x.dur,0)+(s.dur-remain);
  const tot=steps.reduce((a,x)=>a+x.dur,0);
  $('plProg').style.width=Math.min(100,done/tot*100)+'%';
  const el=Math.floor((Date.now()-startedAt-pausedTotal-(pauseStart?Date.now()-pauseStart:0))/1000);
  $('plElapsed').textContent=fmtClock(Math.max(0,el));
}
function togglePlay(){
  running=!running;
  $('plStage').classList.toggle('paused',!running);
  if(running){
    endAt=Date.now()+remain*1000;
    if(pauseStart){pausedTotal+=Date.now()-pauseStart;pauseStart=0;}
    tick=setInterval(loop,200);
    $('playIco').innerHTML='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  }else{
    clearInterval(tick);pauseStart=Date.now();
    $('playIco').innerHTML='<path d="M8 5v14l11-7L8 5z"/>';
  }
}
function loop(){
  const r=Math.max(0,Math.ceil((endAt-Date.now())/1000));
  if(r!==remain){
    remain=r;
    if(remain<=3&&remain>0&&remain!==lastBeep){beep(660,.09);lastBeep=remain;}
    if(remain===0){beep(880,.28);nextStep();return;}
  }
  paint();
}
function nextStep(){
  if(idx<steps.length-1){idx++;loadStep();}
  else finishSession();
}
function prevStep(){
  if(idx>0){idx--;loadStep();}
  else{remain=steps[0].dur;if(running)endAt=Date.now()+remain*1000;paint();}
}

/* salir — modal propio (confirm() nativo no funciona en visores iOS) */
function askQuit(){
  if(running)togglePlay();
  $('quitModal').classList.add('active');
}
function closeQuit(){
  $('quitModal').classList.remove('active');
  if(!running)togglePlay();
}
function doQuit(){
  $('quitModal').classList.remove('active');
  clearInterval(tick);running=false;
  $('plStage').classList.remove('paused');
  $('playIco').innerHTML='<path d="M8 5v14l11-7L8 5z"/>';
  $('player').classList.remove('active');
  releaseWake();
}
$('quitModal').addEventListener('click',e=>{if(e.target===$('quitModal'))closeQuit();});
function releaseWake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}}

let sumDur=0;
function finishSession(){
  clearInterval(tick);running=false;
  $('plStage').classList.remove('paused');
  $('playIco').innerHTML='<path d="M8 5v14l11-7L8 5z"/>';
  beep(880,.5);if(navigator.vibrate)navigator.vibrate([80,60,80,60,160]);
  sumDur=Math.floor((Date.now()-startedAt-pausedTotal)/1000);
  $('sumTime').textContent=fmtClock(sumDur);
  $('sumName').textContent=curRt.name;
  $('player').classList.remove('active');
  $('summary').classList.add('active');
  releaseWake();
}
function backHome(){$('summary').classList.remove('active');window.scrollTo(0,0);}

/* ── AUDIO ── */
let actx=null;
function beep(f,d){
  if(!SOUND)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=f;o.type='sine';
    g.gain.setValueAtTime(.001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.4,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+d+.05);
  }catch(e){}
}
function soundUI(){
  $('soundIco').innerHTML=SOUND
    ?'<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>'
    :'<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/>';
}
$('soundBtn').onclick=()=>{SOUND=!SOUND;persistSound();soundUI();if(SOUND)beep(660,.1);};

const DAYS=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const MONTHS=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const PLAN={
 1:{t:'FUNCIONAL · ENTRENADOR',cls:'cardio',sug:[]},
 2:{t:'ZONA 2 · RUN / BICI 40\u2032',cls:'cardio',sug:['P1']},
 3:{t:'DESCANSO',cls:'rest',sug:['C1']},
 4:{t:'DESCANSO',cls:'rest',sug:['C1']},
 5:{t:'ZONA 2 · RUN / BICI 40\u2032',cls:'cardio',sug:['P1']},
 6:{t:'KB · FUERZA + POTENCIA',cls:'',sug:['S1','S2','C2']},
 0:{t:'KB · RESISTENCIA + CORE',cls:'',sug:['D1','D2']}
};
function rtRow(rt){
  return '<button class="rt" onclick="openPreview(ROUTINES.find(r=>r.id===\''+rt.id+'\'))">'+
    '<div class="ic '+rt.fam+'">'+rt.id+'</div>'+
    '<div><div class="nm">'+rt.name+'</div><div class="mt">'+rt.tag+'</div></div>'+
    '<span class="go">›</span></button>';
}
function renderHome(){
  const now=new Date(),dow=now.getDay(),p=PLAN[dow];
  $('heroBox').innerHTML=
    '<div class="eyebrow">PLAN DE HOY</div>'+
    '<div class="day">'+DAYS[dow]+'</div>'+
    '<div class="date">'+now.getDate()+' '+MONTHS[now.getMonth()]+' '+now.getFullYear()+'</div>'+
    '<div class="plan-tag '+p.cls+'">'+(p.cls==='rest'?'◌':'●')+' '+p.t+'</div>';
  let h='';
  if(p.sug.length){
    h='<div class="sec-title">SESIÓN SUGERIDA</div>';
    p.sug.forEach(id=>{h+=rtRow(ROUTINES.find(r=>r.id===id));});
  }
  $('todaySuggest').innerHTML=h;
  $('listSab').innerHTML=ROUTINES.filter(r=>r.fam==='sab').map(rtRow).join('');
  $('listDom').innerHTML=ROUTINES.filter(r=>r.fam==='dom').map(rtRow).join('');
  $('listCom').innerHTML=ROUTINES.filter(r=>r.fam==='com'||r.fam==='pro'||r.fam==='run').map(rtRow).join('');
  $('genMat').innerHTML=MATS.map(m=>'<button class="chip'+(genSel.mat===m.id?' on':'')+'" onclick="setGen(\'mat\',\''+m.id+'\')">'+m.l+'</button>').join('');
  $('genObj').innerHTML=OBJS.map(o=>'<button class="chip'+(genSel.obj===o.id?' on':'')+'" onclick="setGen(\'obj\',\''+o.id+'\')">'+o.l+'</button>').join('');
  $('genDur').innerHTML=DURS.map(d=>'<button class="chip'+(genSel.dur===d?' on':'')+'" onclick="setGen(\'dur\','+d+')">'+d+'\u2032</button>').join('');
}
function setGen(k,v){genSel[k]=v;renderHome();}

/* INIT */
soundUI();renderHome();
</script>
